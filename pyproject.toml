[project]
name = "glassalgo-v3"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
	# Core numerical & image processing
	"numpy>=1.26",
	"opencv-python>=4.9.0",  # 如果服务器无显示环境可改为 opencv-python-headless

	# Web / API
	"fastapi>=0.110.0",
	"uvicorn[standard]>=0.29.0",

	# Data validation (fastapi 会依赖, 这里显式声明方便升级控制)
	"pydantic>=2.6.0",

	# HTTP client
	"requests>=2.31.0",

	# Performance JIT
	"numba>=0.59.0",
	"llvmlite>=0.42.0",  # 与 numba 版本配套

	# Clustering (DBSCAN used) - 正确包名是 scikit-learn 不是 scikit
	"scikit-learn>=1.4.0",
	"nuitka>=2.3",
	"scipy>=1.12.0",  # 打包命令中引用 --include-package=scipy
	"pyserial"
]
