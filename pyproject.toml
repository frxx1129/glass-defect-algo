[project]
name = "glass-defect-algo"
version = "0.1.0"
description = "High-performance glass defect inspection algorithm and production runtime"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.12"
dependencies = [
	# Core numerical & image processing
	"numpy>=1.26",
	"opencv-python>=4.9.0",  # 如果服务器无显示环境可改为 opencv-python-headless

	# Web / API
	"fastapi>=0.110.0",
	"uvicorn[standard]>=0.29.0",

	# Data validation (fastapi 会依赖, 这里显式声明方便升级控制)
	"pydantic>=2.6.0",

	# HTTP client
	"requests>=2.31.0",

	"nuitka>=2.3",
	"pyserial",
	"Pillow",
	"pyyaml"
]
